# registry-stats alert rules for Loki's ruler (LogQL).
# These three rules read the container log, because their conditions leave no
# series to key on. Ship the logs to Loki, for example with Grafana Alloy's
# Docker log discovery. The selector label is container. Use job or service if
# your collector sets those instead. The five metric rules are in
# alerts/promql.yaml. Load each file into its own ruler.
# The rules assume LOG_LEVEL=info, and docs/monitoring.md lists what other
# levels silence. Thresholds, for: windows and severity labels are starting
# points.
groups:
  - name: registry-stats
    rules:
      # Every rule matches the text of each log line with line filters and no parser.
      # A level, msg, path or status label your collector sets cannot change what it matches.
      # The msg anchor skips a phrase that appears only inside another field's value.
      - alert: RegistryStatsConfigRejected
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"}
            |~ ` msg="[^"]*(no repos configured|skipping unusable repo ref|docker hub wildcard expanded no repos|ghcr owner has no public container packages|invalid POLL_INTERVAL_HOURS|POLL_INTERVAL_HOURS clamped)` [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            registry-stats config has an unusable repo entry, empty wildcard or
            bad interval
          description: >
            registry-stats skipped a DOCKERHUB_REPOS or GHCR_REPOS entry, found
            none usable, expanded a wildcard to no public images, or corrected a
            bad POLL_INTERVAL_HOURS. Skipped images are never polled. Read the
            log line for the value to fix.
      # Keyed on the uppercase slog level, so one rule covers serving and collection errors.
      # The second filter drops only the readiness check's 503 access record, which every start and shutdown logs at ERROR.
      - alert: RegistryStatsError
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"}
            |~ ` level=ERROR msg=`
            !~ ` level=ERROR msg=http method=\S+ path=/api/health status=503 ` [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats logged an error"
          description: >
            registry-stats logged an ERROR in the last hour. The rule covers
            serving, configuration and collection errors, other than the
            readiness check's startup and shutdown 503. Read `docker logs
            registry-stats`. A GHCR format change logs a link to open an issue.
      # Matches only series-omission lines that can also log at WARN.
      # ERROR-only records belong to RegistryStatsError.
      - alert: RegistryStatsCollectionIncomplete
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"}
            |~ ` msg="[^"]*(hit page cap|listing partially failed|ghcr listing refused package candidates|ghcr listing page states no usable package count|ghcr scrape failed|docker hub fetch failed)` [2h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            registry-stats cycle exported an incomplete set of image series
          description: >
            A cycle left some image series off /metrics. A listing hit its page
            cap, lost a page or gave no usable count, a fetch or scrape failed,
            or GHCR refused candidates. Check the log for the owner or repo.
