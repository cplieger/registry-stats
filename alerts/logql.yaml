# Recommended alert rules for registry-stats. Loki ruler (LogQL) rule group:
# these three rules (RegistryStatsConfigRejected, RegistryStatsError,
# RegistryStatsCollectionIncomplete) read the container's log stream, because
# their conditions have no series to key on. A repo ref rejected at parse time
# is never polled, so it produces no metric of any kind, and with both repo
# lists empty, registrystats_collects_total has no series either. A source
# counter advances when a wildcard owner listing wholly fails or more than half
# of its per-image fetch attempts fail. Docker Hub rows whose counts come from
# an owner listing count on neither side of that ratio, so incomplete output
# can leave registrystats_collect_errors_total unchanged. Ship the container's
# logs to Loki (Grafana Alloy's Docker log discovery does this with no
# configuration) and evaluate them with Loki's ruler. The selector label is
# `container`; use `job` or `service` if your collector keys on those instead.
# The rules extract record fields under an `rs_` prefix because Loki otherwise
# uses a `<name>_extracted` label when a collector has already set `level`,
# `msg`, `path`, or `status` as a stream label.
#
# Five further rules read series from /metrics and are PromQL, so they live in
# alerts/promql.yaml.
#
# Load each half into its own ruler: neither ruler parses the other's
# expressions. Firing alerts from both deliver through your Alertmanager like
# any other Prometheus alert. Thresholds, the `for:` windows, and the severity
# labels are starting points.
#
# These rules assume the default LOG_LEVEL=info.
# LOG_LEVEL=error silences RegistryStatsCollectionIncomplete because every
# named incomplete-set line is below ERROR. RegistryStatsConfigRejected's
# startup records work at every LOG_LEVEL because they are emitted before the
# configured level is applied. At LOG_LEVEL=error, the recurring no-repos WARN
# is suppressed, so that alert clears when its startup record ages out of the
# one-hour window. Before this rewrite, an operator running LOG_LEVEL=error had
# no reachable true RegistryStatsCollectionIncomplete firing and exactly one
# reachable false one: a startup WARN emitted before the configured level was
# applied could match when an attribute value spelled one of the rule's phrases;
# parsing `msg` closes that false positive.
---
groups:
  - name: registry-stats
    rules:
      # These messages cover configuration that yields nothing to poll. A ref
      # that fails validation is skipped with a WARN at parse time; a run with
      # no usable ref logs an ERROR at startup plus a WARN every cycle. Neither
      # has a metric: a ref that never parsed produces no series, and with both
      # lists empty registrystats_collects_total has no series either, so
      # RegistryStatsCollectStalled cannot fire.
      - alert: RegistryStatsConfigRejected
        # yamllint disable rule:line-length
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"}
            |~ `no repos configured|skipping unusable repo ref|invalid POLL_INTERVAL_HOURS|POLL_INTERVAL_HOURS clamped`
            | logfmt rs_msg="msg"
            | rs_msg =~ ".*(no repos configured|skipping unusable repo ref|invalid POLL_INTERVAL_HOURS|POLL_INTERVAL_HOURS clamped).*" [1h]
          )) > 0
        # yamllint enable rule:line-length
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            registry-stats rejected part of its configuration or corrected the
            poll interval
          description: >
            registry-stats skipped a DOCKERHUB_REPOS or GHCR_REPOS entry it
            could not parse, or found no usable entry at all, so those images
            are never polled and never reach /metrics; correct the value to
            comma-separated `owner/repo` or `owner/*` pairs. It also fires when
            POLL_INTERVAL_HOURS was corrected: a malformed or negative value
            reverts to the 1-hour default, and a value above 8,760 hours is
            capped at 8,760, so the exporter polls on an interval you did not
            ask for until the value is fixed. A skip line is logged once per
            start, so this clears one window after a restart with a corrected
            value; the no-repos line repeats every cycle.
      - alert: RegistryStatsError
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"} |= `level=ERROR`
            | logfmt rs_level="level", rs_path="path", rs_status="status"
            | rs_level = "ERROR"
            | rs_path != "/api/health" or rs_status != "503" [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats logged an error"
          description: >
            registry-stats logged at least one ERROR in the last hour. The
            expression is level-wide, so it covers serving and configuration
            errors as well as collection ones: registry response-shape or GHCR
            markup drift, a wildcard owner with no public images, a cycle in
            which every registry failed, a startup with no usable repo
            configuration, or a 5xx from the exporter's own endpoint other
            than the readiness gate's startup/shutdown 503. Read `docker logs
            registry-stats` for the message; a GHCR format change carries a
            link to open an issue.
      # The WARN lines mean that this cycle omitted image series. This rule
      # reports those omissions whether or not the source-level health threshold
      # is crossed; RegistryStatsSourceDegraded may fire concurrently. The
      # per-repo Docker Hub fetch and GHCR scrape lines remove one image series.
      # `ghcr listing refused package candidates` catches the nil-error case
      # where a listing returns usable refs but omits published candidates,
      # which no counter can see. On a wholly failed listing or page-cap path,
      # the same line accompanies another member that already fires; because the
      # condition is greater than zero, the extra match cannot change whether
      # this rule fires. A MAJORITY of GHCR package failures, and a GHCR listing
      # that fails WHOLLY, both flip the source unhealthy, so
      # RegistryStatsSourceDegraded owns them through
      # registrystats_collect_errors_total; one failed explicit ref is a
      # majority when it is the only ref. Minority per-repo failures and refused
      # candidates are what this rule exists for. Docker Hub repositories found
      # through a listing sit outside the fetch ratio.
      - alert: RegistryStatsCollectionIncomplete
        # yamllint disable rule:line-length
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"}
            |~ `hit page cap|listing partially failed|ghcr listing refused package candidates|ghcr scrape failed|docker hub fetch failed`
            | logfmt rs_msg="msg"
            | rs_msg =~ ".*(hit page cap|listing partially failed|ghcr listing refused package candidates|ghcr scrape failed|docker hub fetch failed).*" [2h]
          )) > 0
        # yamllint enable rule:line-length
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            registry-stats cycle exported an incomplete set of image series
          description: >
            A collect cycle exported an incomplete set of image series: a
            Docker Hub owner publishes more repositories than an unauthenticated
            listing can enumerate, a Docker Hub repository fetch failed, a GHCR
            owner listing hit its page cap or lost a page, GHCR refused one or
            more published package-link candidates, or a minority of GHCR
            packages failed to scrape. The affected image series are absent
            from /metrics for that cycle whether or not the source-level health
            threshold is crossed. RegistryStatsSourceDegraded may fire
            concurrently: a majority of per-repo failures or a wholly failed
            listing flips the source unhealthy, and one failed explicit ref is
            the majority when it is the only ref. Docker Hub repositories found
            through a listing sit outside the fetch ratio. Read the container
            logs for the affected owner or repo.
