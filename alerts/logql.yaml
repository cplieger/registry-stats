# Recommended alert rules for registry-stats. Loki ruler (LogQL) rule group:
# these three rules (RegistryStatsConfigRejected, RegistryStatsError,
# RegistryStatsCollectionIncomplete) read the container's log stream, because
# their conditions have no series to key on. A repo ref rejected at parse time
# is never polled, so it produces no metric of any kind, and with both repo
# lists empty registrystats_collects_total has no series either. A cycle that
# loses a minority of its repos to a rate limit, a truncated owner listing or a
# changed page keeps the healthy verdict, so registrystats_collect_errors_total
# never moves while the exported counts go quietly incomplete. Ship the
# container's logs to Loki (Grafana Alloy's Docker log discovery does this with
# no configuration) and evaluate them with Loki's ruler. The selector label is
# `container`; use `job` or `service` if your collector keys on those instead.
#
# Five further rules read series from /metrics and are PromQL, so they live in
# alerts/promql.yaml.
#
# Load each half into its own ruler: neither ruler parses the other's
# expressions. Firing alerts from both deliver through your Alertmanager like
# any other Prometheus alert. Thresholds, the `for:` windows, and the severity
# labels are starting points.
#
# These rules assume the default LOG_LEVEL=info.
# LOG_LEVEL=error silences RegistryStatsCollectionIncomplete because every
# named incomplete-set line is below ERROR. RegistryStatsConfigRejected keeps working at every LOG_LEVEL for the config-parse half: those skip warnings
# are emitted once per start BEFORE the configured level is applied, and the
# no-repos state also logs at ERROR. Its two every-cycle members, `no repos
# configured` and `no images found for the configured refs`, come from the
# collect cycle long after the level is applied, so LOG_LEVEL=error silences
# both.
groups:
  - name: registry-stats
    rules:
      # These messages cover configuration that yields nothing to poll. A ref
      # that fails validation is skipped with a WARN at parse time; a run with
      # no usable ref logs an ERROR at startup plus a WARN every cycle; and a
      # ref set that parses but resolves to zero images (a Docker Hub wildcard
      # owner with no public repositories) logs a WARN every cycle - the GHCR
      # form of that state counts as a failed listing and reports as an ERROR
      # under RegistryStatsError, not as a WARN here. None has a metric: a ref
      # that never parsed produces no series, and with both lists empty
      # registrystats_collects_total has no series either, so
      # RegistryStatsCollectStalled cannot fire. The resolved-to-nothing case
      # DOES advance registrystats_collects_total, which is the other reason
      # that rule cannot own it.
      - alert: RegistryStatsConfigRejected
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"}
            |~ `no repos configured|no images found for the configured refs|skipping unusable repo ref|invalid POLL_INTERVAL_HOURS|POLL_INTERVAL_HOURS clamped` [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats rejected part of its configuration or corrected the poll interval"
          description: >
            registry-stats skipped a DOCKERHUB_REPOS or GHCR_REPOS entry it
            could not parse, or found no usable entry at all, so those
            images are never polled and never reach /metrics; correct the
            value to comma-separated `owner/repo` or `owner/*` pairs. It
            also fires when every configured ref parsed but resolved to
            nothing - a Docker Hub wildcard owner with no public
            repositories - which is a well-formed configuration with nothing
            published behind it: publish an image or drop the ref, there is
            no value to correct. The GHCR form of that state does NOT reach
            this rule: an owner with no public container packages counts as
            a failed listing, which makes the cycle degraded and reports it
            under RegistryStatsError instead. It also fires when
            POLL_INTERVAL_HOURS was corrected: a malformed or negative value
            reverts to the 1-hour default, and a value above 8,760 hours is
            capped at 8,760, so the exporter polls on an interval you did not
            ask for until the value is fixed. A skip line is logged once per
            start, so this clears one window after a restart with a corrected
            value; the no-repos and no-images lines repeat every cycle.
      # Keyed on the LEVEL, not on each message: registry-stats uses the slog
      # text handler, so every error line carries `level=ERROR` (uppercase, and
      # a lowercase matcher silently matches nothing). The expression is
      # therefore level-wide rather than collection-specific: one rule covers an
      # all-registries-failed cycle, a GHCR listing that could not be fetched or
      # parsed, a Docker Hub fetch or parse failure, a startup with no usable
      # repo configuration, and a 5xx from the exporter's own endpoint. Only the
      # majority-failure subset of those reaches
      # registrystats_collect_errors_total.
      - alert: RegistryStatsError
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"} |= `level=ERROR` [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats logged an error"
          description: >
            registry-stats logged at least one ERROR in the last hour. The
            expression is level-wide, so it covers serving and configuration
            errors as well as collection ones: a failed registry fetch or
            parse, a GHCR page whose markup changed, a cycle in which every
            registry failed, a startup with no usable repo configuration, or a
            5xx from the exporter's own endpoint. Read
            `docker logs registry-stats` for the message; a GHCR format change
            carries a link to open an issue.
      # The WARN lines that mean "this cycle exported an incomplete set of image
      # or tag series" while the app's health verdict stays healthy, so
      # registrystats_collect_errors_total never moves and every PromQL rule in
      # alerts/promql.yaml stays quiet. `ghcr scrape failed` is the per-package
      # line; a minority of GHCR packages failing removes their image series.
      # `ghcr listing refused package candidates` catches the nil-error case where a
      # listing returns usable refs but omits published candidates, which no counter
      # can see. On a wholly failed listing or page-cap path, the same line
      # accompanies another member that already fires; because the condition is
      # greater than zero, the extra match cannot change whether this rule fires.
      # Enumerated rather than keyed on level=WARN, because the WARN stream also
      # carries the liveness-marker transition `health state changed
      # healthy=false`, which every container start emits once as it clears a
      # marker inherited from its predecessor. A MAJORITY of package failures,
      # and a listing that fails WHOLLY, both flip the source unhealthy, so
      # RegistryStatsSourceDegraded owns them through
      # registrystats_collect_errors_total; the MINORITY and refused-candidate cases
      # are what this rule exists for.
      - alert: RegistryStatsCollectionIncomplete
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"}
            |~ `hit page cap|listing partially failed|ghcr listing refused package candidates|ghcr scrape failed` [2h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats cycle exported an incomplete set of image series"
          description: >
            A collect cycle exported an incomplete set of image series: a
            Docker Hub owner publishes more repositories than an unauthenticated
            listing can enumerate, a GHCR owner listing hit its page cap or lost
            a page, GHCR refused one or more published package-link candidates, or a
            minority of GHCR packages failed to scrape. The affected image
            series are absent from /metrics for that cycle while every PromQL
            rule stays quiet. Read the container logs for the affected owner or
            repo.
