# registry-stats alert rules for a Prometheus or Mimir ruler (PromQL).
# These five rules read the series on /metrics, so scrape that endpoint first.
# The scrape job label is yours. The rules assume job="registry-stats".
# The three log-based rules are in alerts/logql.yaml. Load each file into its
# own ruler, because neither ruler parses the other's expressions.
# Thresholds, for: windows and severity labels are starting points.
# docs/monitoring.md explains each rule.
groups:
  - name: registry-stats
    rules:
      # Two rules, because neither covers the other. `up == 0` catches a
      # failing target and keeps its instance label. `absent()` catches a
      # target that no longer exists. Use an exact job matcher, never a regex.
      - alert: RegistryStatsTargetDown
        expr: up{job="registry-stats"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats exporter down"
          description: >
            No successful scrape of registry-stats for 15m while the target is
            still configured. Dashboards go stale and the other PromQL rules are
            blind. Check `docker logs registry-stats`, then your scrape port and
            network.
      - alert: RegistryStatsTargetAbsent
        expr: absent(up{job="registry-stats"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats has no scrape target at all"
          description: >
            No up{job="registry-stats"} series exists, so registry-stats is no
            longer a configured scrape target. Look for a removed scrape target
            or scrape config, or a deleted Kubernetes pod or ServiceMonitor.
            Every other PromQL rule is blind.
      # Short detection range under a long for:, on purpose. The intuitive
      # increase(...[6h]) == 0 fires after every container start.
      # Drop this rule in one-shot mode (POLL_INTERVAL_HOURS=0).
      - alert: RegistryStatsCollectStalled
        expr: sum by (job, instance) (increase(registrystats_collects_total[15m])) == 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "registry-stats has not completed a collect cycle in 6h"
          description: >
            registrystats_collects_total has not advanced for 6h while the
            exporter is up. It keeps serving its last values. Check `docker logs
            registry-stats` for scrape or listing errors. With no repos
            configured, RegistryStatsConfigRejected fires instead.
      # The uptime arm covers a failure before the first scrape, when
      # increase() has no earlier sample to subtract.
      - alert: RegistryStatsSourceDegraded
        expr: |
          increase(registrystats_collect_errors_total[3h]) > 0
          or (
            registrystats_collect_errors_total > 0
            and on (job, instance)
            (time() - process_start_time_seconds < 3 * 60 * 60)
          )
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats collection failing for {{ $labels.source }}"
          description: >
            A wildcard owner listing failed, or most per-image fetches failed,
            for this source. Those repos leave /metrics until a later cycle
            succeeds, and other owners keep updating. Check `docker logs
            registry-stats` for the owner and the reason.
      # registrystats_image_pulls_total is a gauge despite its _total suffix.
      # Use delta() over a window, never rate() or increase(), which read the
      # downward restatement this rule detects as a counter reset.
      - alert: RegistryStatsPullCountRegressed
        expr: registrystats_image_pulls_total < max_over_time(registrystats_image_pulls_total[2d])
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats pull count regressed for {{ $labels.registry }}/{{ $labels.owner }}/{{ $labels.repo }}"
          description: >
            registrystats_image_pulls_total for this image is below its highest
            value of the last 2 days. A scrape returned a wrong count without an
            error, or the registry restated the total. Check `docker logs
            registry-stats` for the affected repo.
