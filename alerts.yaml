# Recommended alert rules for registry-stats. MIXED rule group: five rules are
# PromQL and three are LogQL, because a collect cycle that loses images still
# returns a healthy verdict, and every condition that leaves no series still
# leaves a log line.
#
# The five PromQL rules (RegistryStatsTargetDown, RegistryStatsTargetAbsent,
# RegistryStatsCollectStalled, RegistryStatsSourceDegraded,
# RegistryStatsPullCountRegressed) read series from /metrics: scrape it and
# evaluate them with Prometheus or the Mimir ruler. Each rule below documents
# its own series prerequisites and no-series case. The scrape `job` label is
# yours; the examples assume job="registry-stats".
#
# The three LogQL rules (RegistryStatsConfigRejected, RegistryStatsCollectFailed,
# RegistryStatsCollectionIncomplete) read the container's log stream, because
# their conditions have no series to key on. A repo ref rejected at parse time
# is never polled, so it produces no metric of any kind, and with both repo
# lists empty registrystats_collects_total has no series either. A cycle that
# loses a minority of its repos to a rate limit, a truncated owner listing or a
# changed page keeps the healthy verdict, so registrystats_collect_errors_total
# never moves while the exported counts go quietly incomplete. Ship the
# container's logs to Loki (Grafana Alloy's Docker log discovery does this with
# no configuration) and evaluate them with Loki's ruler. The selector label is
# `container`; use `job` or `service` if your collector keys on those instead.
#
# Load each half into its own ruler: neither ruler parses the other's
# expressions. Firing alerts from both deliver through your Alertmanager like
# any other Prometheus alert. Thresholds, the `for:` windows, and the severity
# labels are starting points.
#
# The LogQL rules assume the default LOG_LEVEL=info.
# RegistryStatsCollectionIncomplete keys on WARN lines emitted during collect
# cycles, so LOG_LEVEL=error silences it. RegistryStatsConfigRejected keeps
# working at every LOG_LEVEL for the config-parse half: those skip warnings are
# emitted once per start BEFORE the configured level is applied, and the
# no-repos state also logs at ERROR. Its two every-cycle members, `no repos
# configured` and `no images found for the configured refs`, come from the
# collect cycle long after the level is applied, so LOG_LEVEL=error silences
# both.
groups:
  - name: registry-stats
    rules:
      # Two arms, because neither covers the other. `up == 0` catches a target
      # that is configured and failing, and keeps its labels so the alert names
      # which instance. `absent(up{...})` catches a target that stopped EXISTING
      # (a dropped scrape target, a removed scrape config, a deleted Kubernetes
      # pod or ServiceMonitor) where `up` has no series and `up == 0` can never
      # match.
      #
      # Use an EXACT job matcher, not a regex. A regex form
      # (absent(up{job=~".*x.*"} == 1)) asks whether ANY matching target is up,
      # so one healthy replica masks every failed one, and its synthetic result
      # carries no job label to route or group on.
      - alert: RegistryStatsTargetDown
        expr: up{job="registry-stats"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats exporter down"
          description: >
            No successful scrape of registry-stats for 15m while the target is
            still configured, so image-pull dashboards go stale and every
            other PromQL rule here is blind. The scrape itself is failing:
            container down, wrong port, or network. Check
            `docker logs registry-stats` and your Alloy or Prometheus scrape.
            The `job` label is whatever you set in your scrape config.
      - alert: RegistryStatsTargetAbsent
        expr: absent(up{job="registry-stats"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats has no scrape target at all"
          description: >
            There is no up{job="registry-stats"} series, so registry-stats is
            not merely failing to scrape but is no longer a configured target:
            a dropped scrape target, a removed scrape config, or a deleted
            Kubernetes pod or ServiceMonitor. Every other PromQL rule here is
            blind.
      # Detection range SHORT, `for:` long, and that order is load-bearing.
      # The intuitive form (increase(...[3h]) == 0 under a short `for:`) reads
      # true as soon as a freshly started counter has two samples at the same
      # value, so it fires about 30m after every container start and clears at
      # the first scheduled cycle. Measuring absence over 15m and requiring it
      # to hold for 3h fires 3h after the LAST completed cycle instead, and a
      # restart resets the pending timer at its own startup cycle.
      #
      # Set `for:` to about three POLL_INTERVAL_HOURS. In one-shot mode
      # (POLL_INTERVAL_HOURS=0) the counter advances exactly once by design, so
      # drop this rule: there is no recurring cycle to miss.
      - alert: RegistryStatsCollectStalled
        expr: sum by (job, instance) (increase(registrystats_collects_total[15m])) == 0
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "registry-stats has not completed a collect cycle in 3h"
          description: >
            registrystats_collects_total has not advanced for 3h while the
            exporter is up (the default POLL_INTERVAL_HOURS is 1). The exporter
            keeps serving its last values but no longer polls Docker Hub or
            GHCR. Check `docker logs registry-stats` for scrape or listing
            errors. This rule cannot fire when no repos are configured at all:
            the counter has no series then, so RegistryStatsConfigRejected
            owns that case.
      # The app's own per-source verdict. registry-stats increments
      # collect_errors_total once for a cycle in which that source failed a
      # MAJORITY of its repos, or lost an owner listing outright, so one
      # increment already means most of that registry's numbers are
      # missing rather than one flaky repo. A minority failure deliberately
      # does not move this counter, which is what
      # RegistryStatsCollectionIncomplete covers.
      #
      # Both per-source counters are pre-minted at zero for every configured
      # source at process start, so increase() has an earlier sample to
      # subtract from and the single-failure case, the one worth knowing about,
      # fires. A source with no configured refs has no series at all, so this
      # cannot fire for a registry the deployment never polls.
      - alert: RegistryStatsSourceDegraded
        expr: increase(registrystats_collect_errors_total[3h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats collection failing for {{ $labels.source }}"
          description: >
            registrystats_collect_errors_total advanced for this source, so a
            collect cycle failed for most of its repos. Those images stop
            appearing on /metrics until a later cycle succeeds. Check
            `docker logs registry-stats` for the per-repo reason: a rate limit,
            an HTTP failure, or a page-format change.
      - alert: RegistryStatsPullCountRegressed
        expr: registrystats_image_pulls_total < max_over_time(registrystats_image_pulls_total[2d])
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats pull count regressed for {{ $labels.registry }}/{{ $labels.owner }}/{{ $labels.repo }}"
          description: >
            registrystats_image_pulls_total for this image is LOWER than its
            highest value over the last 2 days. A failed scrape is skipped
            rather than exported as zero, so a drop means either a scrape
            produced a wrong count without erroring (the silent-wrong-count
            corner of the GHCR download-count parsing heuristic in
            internal/ghcr/scraper.go) or the registry itself restated the
            total. Check `docker logs registry-stats` for the affected repo;
            if GitHub changed its package-page markup, the download-count parser
            needs updating.
      # LogQL from here down: evaluate the three rules below with Loki's ruler,
      # not with Prometheus.
      #
      # These messages cover configuration that yields nothing to poll. A ref
      # that fails validation is skipped with a WARN at parse time; a run with
      # no usable ref logs an ERROR at startup plus a WARN every cycle; and a
      # ref set that parses but resolves to zero images (a wildcard owner with
      # no public repositories) logs a WARN every cycle. None has a metric: a
      # ref that never parsed produces no series, and with both lists empty
      # registrystats_collects_total has no series either, so
      # RegistryStatsCollectStalled cannot fire. The resolved-to-nothing case
      # DOES advance registrystats_collects_total, which is the other reason
      # that rule cannot own it.
      - alert: RegistryStatsConfigRejected
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"}
            |~ `no repos configured|no images found for the configured refs|skipping invalid repo ref|skipping repo ref with unsafe characters` [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats repo configuration was rejected or yielded nothing to poll"
          description: >
            registry-stats skipped a DOCKERHUB_REPOS or GHCR_REPOS entry it
            could not parse, or found no usable entry at all, or every
            configured ref resolved to nothing (a wildcard owner with no public
            repositories), so those images are never polled and never reach
            /metrics. Correct the value to comma-separated `owner/repo` or
            `owner/*` pairs. A skip line is logged once per start, so this
            clears one window after a restart with a corrected value; the
            no-repos and no-images lines repeat every cycle.
      # Keyed on the LEVEL, not on each message: registry-stats uses the slog
      # text handler, so every error line carries `level=ERROR` (uppercase, and
      # a lowercase matcher silently matches nothing). The expression is
      # therefore level-wide rather than collection-specific: one rule covers an
      # all-registries-failed cycle, a GHCR listing that could not be fetched or
      # parsed, a Docker Hub fetch or parse failure, a startup with no usable
      # repo configuration, and a 5xx from the exporter's own endpoint. Only the
      # majority-failure subset of those reaches
      # registrystats_collect_errors_total.
      - alert: RegistryStatsCollectFailed
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"} |= `level=ERROR` [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats logged an error"
          description: >
            registry-stats logged at least one ERROR in the last hour. The
            expression is level-wide, so it covers serving and configuration
            errors as well as collection ones: a failed registry fetch or
            parse, a GHCR page whose markup changed, a cycle in which every
            registry failed, a startup with no usable repo configuration, or a
            5xx from the exporter's own endpoint. Read
            `docker logs registry-stats` for the message; a GHCR format change
            carries a link to open an issue.
      # The WARN lines that mean "this cycle exported an incomplete set of image
      # or tag series" while the app's health verdict stays healthy, so
      # registrystats_collect_errors_total never moves and every PromQL rule
      # above stays quiet. `ghcr scrape failed` is the per-package line; a
      # minority of GHCR packages failing removes their image series. The two
      # tag-count failure lines keep the Docker Hub image series but omit its
      # tag series. Enumerated rather than keyed on level=WARN, because the WARN
      # stream also carries two shutdown lines that would fire on every
      # redeploy. A MAJORITY of package failures, and a listing that fails
      # WHOLLY, both flip the source unhealthy, so RegistryStatsSourceDegraded
      # owns them through registrystats_collect_errors_total; the MINORITY and
      # tag-count cases are what this rule exists for.
      - alert: RegistryStatsCollectionIncomplete
        expr: |
          sum by (container) (count_over_time(
            {container="registry-stats"}
            |~ `hit page cap|listing partially failed|rate limited|ghcr scrape failed|tag count fetch failed|tag count parse failed` [2h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "registry-stats cycle exported an incomplete set of image or tag series"
          description: >
            A collect cycle exported an incomplete set of image or tag series:
            an owner listing stopped at its page cap or lost a page, a request
            was rate limited, a minority of GHCR packages failed to scrape, or
            a Docker Hub repo's tag count could not be read. The affected image
            or tag series are absent from /metrics for that cycle while every
            PromQL rule stays quiet, so the dashboard can show incomplete data.
            Track fewer packages or raise POLL_INTERVAL_HOURS if the rate
            limiting repeats.
