# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (the distroless
# `registry-stats health` file-marker probe) to report "healthy" - proving the
# binary runs, binds its HTTP server, and the health probe works. The marker
# tracks collect success, so at least one repo must be configured; an empty
# config is unhealthy by design.
SMOKE_APP_NAME=registry-stats
SMOKE_TIMEOUT=90
# A stable, unauthenticated Docker Hub repo so the initial collect succeeds
# and the marker flips healthy, plus one unusable ref at LOG_LEVEL=error:
# the config warnings are emitted before the parsed level is applied, so
# this line must appear even at error level. It is what
# RegistryStatsConfigRejected matches; the in-process ordering is pinned by
# TestLoadConfig_emitsWarningsBeforeApplyingLogLevel, and this line proves
# it survives into the shipped image.
SMOKE_RUN_ARGS="-e DOCKERHUB_REPOS=library/alpine,bad//ref -e LOG_LEVEL=error"
SMOKE_LOG_PATTERN="skipping unusable repo ref"
