# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (the distroless
# `registry-stats health` file-marker probe) to report "healthy" - proving the
# binary runs, binds its HTTP server, and the health probe works. The marker
# tracks collect success, so at least one repo must be configured; an empty
# config is unhealthy by design.
SMOKE_APP_NAME=registry-stats
SMOKE_TIMEOUT=90
# A stable, unauthenticated Docker Hub repo so the initial collect succeeds and
# the marker flips healthy.
SMOKE_RUN_ARGS="-e DOCKERHUB_REPOS=library/alpine"
